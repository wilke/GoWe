name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Cross-compile (release targets)
        # Catch platform-specific breakage (e.g. Linux-only syscalls) before it
        # fails the GoReleaser build at release time. Mirrors .goreleaser.yaml.
        run: |
          for target in darwin/amd64 darwin/arm64 linux/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
          done
      - name: Test
        run: go test ./...

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Test store on PostgreSQL
        run: GOWE_TEST_REQUIRE_POSTGRES=1 GOWE_TEST_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/postgres go test -count=1 ./internal/store/...
